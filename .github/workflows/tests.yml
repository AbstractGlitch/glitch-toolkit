name: tests

# The 38 tests, run by something other than a person remembering to run them.
#
# This file lives at glitch/.github/ inside the private monorepo, which is not a
# repository root, so GitHub ignores it there. The public mirror is a subtree of
# glitch/, so on that side it lands at .github/workflows/tests.yml and runs. One
# file, and CI on exactly the repository a stranger can open a pull request
# against.
#
# WHY TWO JOBS RATHER THAN ONE MATRIX. The base package promises no dependencies
# and the MCP SDK requires Python >= 3.10, so `pip install '.[mcp]'` cannot run
# on the oldest Python this package supports. Splitting them means the
# dependency-free promise is tested on the floor version, where it matters, and
# the server is tested where its SDK can actually install. One matrix would have
# forced a choice between those two.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here reads or writes the repository beyond checking it out.
permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The two suites that must pass with nothing installed but the package
    # itself. If these ever need a dependency, the promise in the README is
    # broken and this job is where that surfaces.
    name: core · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Heredocs below, and PowerShell is the default shell on the Windows runner.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.9 is the real floor: the build backend is setuptools >= 77 (chosen
        # for the PEP 639 licence field) and no such setuptools runs on 3.8.
        python: ["3.9", "3.12", "3.13"]
        include:
          # Windows is not a nice-to-have here. The book's audience works in
          # PowerShell, the owner's own checkout has core.autocrlf=true, and
          # until 2026-09-08 these 28 tests had only ever run on Linux. They
          # were run by hand on Windows that day and passed; this keeps that
          # true rather than leaving it a one-off.
          - os: windows-latest
            # 3.13, because that is what the owner's own Windows machine runs and
            # a reader like them is the configuration worth covering.
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record what was installed before we touch anything
        # The measurement has to be a DELTA, not a census. The first version of
        # this guard listed everything pip could see after the install and
        # failed on anything that was not glitch-toolkit. That passed on Linux
        # and failed on the Windows runner, whose image ships pipx and its
        # dependencies (argcomplete, click, colorama, filelock, packaging,
        # platformdirs, userpath) in the same interpreter. None of them came
        # from this package. A check that fires on a healthy repository is as
        # broken as one that never fires, so it now compares before with after.
        run: |
          python -m pip install --upgrade pip
          # A path in the workspace, not /tmp. Git Bash on the Windows runner
          # maps /tmp somewhere the Windows Python reading it would not find,
          # which is the same cross-platform assumption this guard exists to
          # stop making.
          python -m pip freeze > pip-before.txt
          echo "packages present before installing the package: $(wc -l < pip-before.txt)"
      - name: Install the package, and nothing else
        run: python -m pip install .
      - name: Prove the base install pulled in no dependencies
        # The README says "no dependencies" and RELEASING.md calls it a promise
        # rather than an accident. Asserted here instead of trusted.
        run: |
          python - <<'PY'
          import subprocess, sys

          def names(text):
              out = set()
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  for sep in (" @ ", "==", " ", "<", ">"):
                      if sep in line:
                          line = line.split(sep, 1)[0]
                          break
                  out.add(line.strip().lower().replace("_", "-"))
              return out

          before = names(open("pip-before.txt").read())
          after = names(subprocess.run(
              [sys.executable, "-m", "pip", "freeze"],
              capture_output=True, text=True).stdout)

          added = sorted(after - before - {"glitch-toolkit"})
          if added:
              print("::error::installing the package added: " + ", ".join(added))
              raise SystemExit(1)
          print("the install added nothing but glitch-toolkit itself")
          PY
      - name: test_cli.py
        run: python tests/test_cli.py
      - name: test_ledger.py
        # always(), so a failure in test_cli.py cannot mark this one "skipped"
        # and hide a second failure behind the first. On the 3.9 run that found
        # the PEP 604 crash, the ledger suite never reported at all.
        if: always()
        run: python tests/test_ledger.py

  full:
    # Every suite, including the server, with the extra installed. This is the
    # only job that can prove none of them skipped.
    name: full · py3.12 with [mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the MCP extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[mcp]'
      - name: Run every suite, and refuse a skip
        # run_all.py exits `1 if failed else 0`, so a SKIPPED suite leaves the
        # exit code at 0. Without the grep below this job would go green with
        # ten tests unrun — which is precisely the false green check_gates
        # exists to catch, in the package that ships it.
        run: |
          set -o pipefail
          python tests/run_all.py | tee suites.txt
          if grep -q "SKIPPED" suites.txt; then
            echo "::error::a suite was SKIPPED; run_all.py still exits 0, so this job would otherwise be green with tests unrun"
            exit 1
          fi
          if ! grep -q "test_mcp_server.py *ok" suites.txt; then
            echo "::error::the server suite did not report ok, so the [mcp] extra is not doing what this job assumes"
            exit 1
          fi

  dist:
    # The three RELEASING.md pre-upload checks that can be automated. They exist
    # because on release day the built artifacts carried a README saying the
    # package was "not published anywhere" — metadata is shipped, and a version
    # on PyPI cannot be replaced.
    name: dist metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: twine check
        run: python -m twine check dist/*
      - name: The sdist must carry its own test runner
        # MANIFEST.in exists because setuptools' defaults missed this file, and
        # an sdist whose documented test command does not work is one a packager
        # cannot check.
        run: |
          python - <<'PY'
          import glob, tarfile
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = tarfile.open(sdist).getnames()
          missing = [w for w in ("tests/run_all.py", "LICENSE", "NOTICE")
                     if not any(n.endswith("/" + w) for n in names)]
          if missing:
              print("::error::sdist is missing: " + ", ".join(missing))
              raise SystemExit(1)
          print("sdist carries the test runner, LICENSE and NOTICE")
          PY
      - name: No CRLF in either distribution
        # 0.1.0 shipped CRLF in all 21 wheel files and all 26 sdist files,
        # built on a Windows clone with core.autocrlf=true. .gitattributes now
        # pins the working tree to LF everywhere; this asserts it rather than
        # trusting it, because the failure is invisible until someone diffs two
        # builds of the same commit.
        run: |
          python - <<'PY'
          import glob, io, tarfile, zipfile
          bad = []
          whl = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(whl)
          for n in z.namelist():
              if n.endswith((".py", ".md", ".json", ".txt")) and b"\r\n" in z.read(n):
                  bad.append(whl + ":" + n)
          sd = glob.glob("dist/*.tar.gz")[0]
          tf = tarfile.open(sd)
          for m in tf.getmembers():
              if m.isfile() and m.name.endswith((".py", ".md", ".json", ".txt")):
                  if b"\r\n" in tf.extractfile(m).read():
                      bad.append(sd + ":" + m.name)
          if bad:
              print("::error::CRLF in {} shipped file(s), e.g. {}".format(len(bad), bad[0]))
              raise SystemExit(1)
          print("both distributions are LF throughout")
          PY
      - name: The two version numbers must agree
        # pyproject.toml carries the released version; src/glitch/__init__.py
        # carries the one glitch-mcp reports over the protocol. They are set by
        # hand in two files, which is how they drift, and a stale __version__
        # misidentifies the running server rather than merely looking untidy.
        run: |
          python - <<'PY'
          import pathlib, re
          proj = pathlib.Path("pyproject.toml").read_text()
          init = pathlib.Path("src/glitch/__init__.py").read_text()
          a = re.search(r'^version\s*=\s*"([^"]+)"', proj, re.M).group(1)
          b = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.M).group(1)
          if a != b:
              print("::error::pyproject says {} and __init__ says {}".format(a, b))
              raise SystemExit(1)
          print("both say " + a)
          PY
      - name: The registry entry must match the release it points at
        # registry/server.json is what the official MCP registry is told, and it
        # names a PyPI version. Publish it against a version that is not on PyPI
        # and the listing is a dangling pointer; publish it against the wrong one
        # and clients install something the entry does not describe. It also
        # carries the ownership marker's other half: the mcp-name in README.md is
        # what proves the namespace, and it is baked into the distribution at
        # build time, so a release without it cannot be listed and cannot be
        # re-uploaded to fix it.
        run: |
          python - <<'PY'
          import json, pathlib, re
          proj = pathlib.Path("pyproject.toml").read_text()
          version = re.search(r'^version\s*=\s*"([^"]+)"', proj, re.M).group(1)
          entry = json.loads(pathlib.Path("registry/server.json").read_text())
          readme = pathlib.Path("README.md").read_text()
          problems = []
          if entry["version"] != version:
              problems.append("server.json says {} and pyproject says {}".format(entry["version"], version))
          for pkg in entry["packages"]:
              if pkg.get("version") != version:
                  problems.append("a package entry says {} and pyproject says {}".format(pkg.get("version"), version))
              if pkg["identifier"] not in ("glitch-toolkit",):
                  problems.append("the package identifier is " + pkg["identifier"])
          # The namespace is granted by GitHub and is CASE SENSITIVE: the registry
          # grants io.github.<login>/* with the login spelled exactly as GitHub
          # spells it. Publishing io.github.abstractglitch/... against a grant for
          # io.github.AbstractGlitch/* is a 403, and it cost a release to learn,
          # because the marker proving ownership is baked into a distribution that
          # cannot be re-uploaded. The repository URL carries the same login, so the
          # two must agree here rather than at the registry.
          owner = entry["repository"]["url"].rstrip("/").split("/")[-2]
          namespace = entry["name"].split("/")[0]
          if namespace != "io.github." + owner:
              problems.append(
                  "the namespace is {} but the repository owner is {}, so the grant is io.github.{}/*"
                  .format(namespace, owner, owner))
          if ("mcp-name: " + entry["name"]) not in readme:
              problems.append("README.md carries no 'mcp-name: {}' marker, so the registry cannot verify the namespace".format(entry["name"]))
          if len(entry["description"]) > 100:
              problems.append("the description is {} characters and the registry allows 100".format(len(entry["description"])))
          if problems:
              for p in problems:
                  print("::error::" + p)
              raise SystemExit(1)
          print("the registry entry, the README marker and the release all say " + version)
          PY
      - name: The wheel must declare Apache-2.0 and ship no do-not-upload marker
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(whl)
          meta = z.read([n for n in z.namelist()
                         if n.endswith("METADATA")][0]).decode("utf-8")
          problems = []
          if "License-Expression: Apache-2.0" not in meta:
              problems.append("no 'License-Expression: Apache-2.0'")
          if "Private :: Do Not Upload" in meta:
              problems.append("the 'Private :: Do Not Upload' classifier is back")
          if "not published anywhere" in meta:
              problems.append("the description still says it is unpublished")
          if problems:
              print("::error::" + "; ".join(problems))
              raise SystemExit(1)
          print("wheel metadata is what the licence decision says it should be")
          PY
